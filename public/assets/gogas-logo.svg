<svg xmlns="http://www.w3.org/2000/svg" width="320" height="100" viewBox="0 0 320 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e31837"/>
      <stop offset="100%" style="stop-color:#f57c00"/>
    </linearGradient>
  </defs>
  <!-- Go Gas banner (brand colors) -->
  <rect x="0" y="0" width="320" height="72" rx="8" fill="url(#bg)"/>
  <!-- Flame -->
  <path d="M28 48c0-10 8-18 8-24 0 6 6 10 6 16 0 8-6 14-14 14s-14-6-14-14c0-4 2-8 4-12 0 6 6 10 10 20z" fill="#fff" opacity="0.95"/>
  <!-- LPG cylinder -->
  <rect x="52" y="22" width="22" height="36" rx="4" fill="#fff" opacity="0.9"/>
  <rect x="56" y="18" width="14" height="6" rx="2" fill="#fff" opacity="0.9"/>
  <ellipse cx="63" cy="58" rx="11" ry="3" fill="#fff" opacity="0.5"/>
  <!-- Go Gas text -->
  <text x="88" y="46" font-family="Arial Black, Arial, sans-serif" font-size="28" font-weight="900" fill="#ffffff">Go</text>
  <text x="145" y="46" font-family="Arial Black, Arial, sans-serif" font-size="28" font-weight="900" fill="#ffffff">Gas</text>
  <!-- Tagline bar -->
  <text x="88" y="62" font-family="Arial, sans-serif" font-size="9" fill="#ffe0b2">Authorized LPG Distributor</text>
  <!-- Agency name below -->
  <text x="0" y="92" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#333">Maa Brahmani Gas Agency</text>
</svg>
