services:
  - type: web
    name: maa-brahmani-lpg-booking
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Optional — attach a 1GB Render disk at /var/data (Starter plan), then set:
      # DATA_DIR=/var/data  and  DATABASE_PATH=/var/data/booking.db
      - key: UPI_ID
        sync: false
      - key: UPI_PAYEE_NAME
        value: Maa Brahmani Gas Agency
      - key: BUSINESS_PHONE
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: GSTIN
        value: 23AABCY3737E1ZJ
      - key: BUSINESS_EMAIL
        value: yoursmeshwork@gmail.com
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_SMS_FROM
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      - key: MSG91_AUTH_KEY
        sync: false
      - key: MSG91_SENDER_ID
        sync: false
